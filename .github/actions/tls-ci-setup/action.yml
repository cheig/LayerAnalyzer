name: Verified TLS build inputs
description: Exact reviewed host tools and anonymously verifiable native dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12.4'
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17.0.17+10'
    - uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: '12266719'
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
    - name: Verify archives, host tools, source, notices and public repaired native pin
      shell: bash
      run: python tools/prepare_tls_ci.py --output "$RUNNER_TEMP/tls-ci-setup"
    - name: Install host-only fixture requirements
      shell: bash
      run: python -m pip install -r native_build/verification/tls/fixtures/requirements.txt -r tools/ci-requirements.txt
    - name: Check installed Go and module graph
      shell: bash
      run: python tools/check_tls_dependencies.py --go "$LAYANALYZER_CI_GO"
