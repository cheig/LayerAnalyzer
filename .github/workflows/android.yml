name: Android CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tls-ci-setup
      - run: chmod +x gradlew
      - name: ARM64 Debug unit tests with production TLS and no probe
        run: >-
          ./gradlew testDebugUnitTest --stacktrace --no-build-cache --no-configuration-cache --rerun-tasks
          -PlayanalyzerEnableTls=true -PlayanalyzerTlsProbe=false
          -PlayanalyzerTlsGo="$LAYANALYZER_CI_GO"
      - run: python tools/run_required_tests.py junit app/build/test-results/testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-reports-tls-on
          path: |
            app/build/reports/tests/
            app/build/test-results/
            ${{ runner.temp }}/tls-ci-setup/setup-report.json
            ${{ runner.temp }}/tls-ci-setup/*.log
          if-no-files-found: warn

  native-tests:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node tools/golden_capture/generate_golden_captures.mjs --check
      - run: node tools/agent_metrics/summarize.mjs --check
      - run: cmake -S native_build/verification/rtp/host_tests -B build/rtp-host -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/rtp-host --parallel 2
      - run: ./build/rtp-host/rtp_host_tests

  tls-tests:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tls-ci-setup
      - run: python tools/run_required_tests.py unittest tools/tests
      - run: python tools/run_required_tests.py unittest native_build/verification/tls
      - name: Uncached full Go and race suites (host-only, no probe tag)
        working-directory: native_go/tlsbridge
        run: |
          set -euo pipefail
          mkdir -p ../../build/ci-tests
          go test -mod=readonly -count=1 -json ./... | tee ../../build/ci-tests/go.json
          python ../../tools/run_required_tests.py go ../../build/ci-tests/go.json
          go test -mod=readonly -race -count=1 -json ./... | tee ../../build/ci-tests/go-race.json
          python ../../tools/run_required_tests.py go ../../build/ci-tests/go-race.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tls-regression-reports
          path: |
            build/ci-tests/
            ${{ runner.temp }}/tls-ci-setup/setup-report.json
            ${{ runner.temp }}/tls-ci-setup/*.log
          if-no-files-found: warn

  build:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tls-ci-setup
      - run: chmod +x gradlew
      - name: ARM64 Debug, androidTest and unsigned Release with one consistent TLS mode
        run: >-
          ./gradlew -I tools/runtime_license_inventory.init.gradle
          -PlayanalyzerEnableTls=true -PlayanalyzerTlsProbe=false
          -PlayanalyzerTlsGo="$LAYANALYZER_CI_GO"
          --no-build-cache --no-configuration-cache --rerun-tasks
          lintDebug assembleDebug compileDebugAndroidTestKotlin assembleDebugAndroidTest
          testReleaseUnitTest lintRelease assembleRelease :app:exportRuntimeLicenseInventory --stacktrace
      - run: python tools/run_required_tests.py junit app/build/test-results/testReleaseUnitTest
      - name: Verify TLS-enabled APKs, production JNI, R8, 16 KiB alignment, notices and inventory staging
        run: |
          set -euo pipefail
          for variant in debug release; do
            apk="app/build/outputs/apk/$variant/app-$variant.apk"
            if [ "$variant" = release ]; then apk="app/build/outputs/apk/release/app-release-unsigned.apk"; fi
            python tools/check_tls_dependencies.py --go "$LAYANALYZER_CI_GO" --expect-tls "on" \
              --apk "$apk" --report "build/tls-$variant-dependencies.json"
            python native_build/verification/tls/check_release_apk.py \
              --apk "$apk" --abi arm64-v8a --variant "$variant" --tls "on" \
              --go "$LAYANALYZER_CI_GO" --readelf "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
              --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" --zipalign "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
              --report "build/tls-$variant-apk.json"
          done
          python tools/stage_release.py create-apk --staging build/ci-staging \
            --inventory build/license-audit/releaseRuntimeClasspath.json \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk
          python tools/stage_release.py verify-apk --staging build/ci-staging
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-build-reports-tls-on
          path: |
            app/build/reports/
            app/build/test-results/testReleaseUnitTest/
            build/license-audit/releaseRuntimeClasspath.json
            build/tls-*.json
            build/tls-production/*/build-manifest.json
            ${{ runner.temp }}/tls-ci-setup/setup-report.json
            ${{ runner.temp }}/tls-ci-setup/*.log
          if-no-files-found: warn

  package:
    # Use pinned Wireshark 4.0.10; upgrades/backports are follow-up maintenance.
    # Build a signed candidate; device validation precedes publishing the draft.
    if: github.event_name == 'push' && github.event.deleted != true && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_APK_PACKAGING == 'true'
    needs: [unit-tests, native-tests, tls-tests, build]
    runs-on: ubuntu-24.04
    env:
      LAYERANALYZER_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      LAYERANALYZER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      LAYERANALYZER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tls-ci-setup
      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$LAYERANALYZER_KEYSTORE_PASSWORD"
          test -n "$LAYERANALYZER_KEY_ALIAS"
          test -n "$LAYERANALYZER_KEY_PASSWORD"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "LAYERANALYZER_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - name: Check, build APK and export resolved runtime inputs
        run: >-
          ./gradlew -I tools/runtime_license_inventory.init.gradle
          -PlayanalyzerEnableTls=true -PlayanalyzerTlsProbe=false
          -PlayanalyzerTlsGo="$LAYANALYZER_CI_GO"
          --no-build-cache --no-configuration-cache --rerun-tasks
          testReleaseUnitTest lintRelease assembleRelease :app:exportRuntimeLicenseInventory --stacktrace
      - name: Require Release tests to run without skips
        run: python tools/run_required_tests.py junit app/build/test-results/testReleaseUnitTest
      - name: Audit final production TLS APK and actual license bytes
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_tls_dependencies.py --go "$LAYANALYZER_CI_GO" --expect-tls on \
            --apk app/build/outputs/apk/release/app-release.apk --report build/tls-release-dependencies.json
          python native_build/verification/tls/check_release_apk.py \
            --apk app/build/outputs/apk/release/app-release.apk --abi arm64-v8a --variant release --tls on \
            --go "$LAYANALYZER_CI_GO" --readelf "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" --zipalign "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            --report build/tls-release-apk.json
      - name: Verify release identity, signing and APK alignment
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python tools/verify_release_apk.py
          --apk app/build/outputs/apk/release/app-release.apk
          --inventory build/license-audit/releaseRuntimeClasspath.json
          --tag "$RELEASE_TAG"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Preserve Release test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-test-reports
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/test-results/testReleaseUnitTest/*.xml
            build/license-audit/releaseRuntimeClasspath.json
            build/tls-release-*.json
            build/tls-production/release/build-manifest.json
            ${{ runner.temp }}/tls-ci-setup/setup-report.json
          if-no-files-found: warn
      - name: Stage APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          python tools/stage_release.py create-apk --staging build/release-staging \
            --inventory build/license-audit/releaseRuntimeClasspath.json \
            --apk app/build/outputs/apk/release/app-release.apk
          python tools/stage_release.py verify-apk --staging build/release-staging
          (cd build/release-staging && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: layeranalyzer-${{ github.ref_name }}
          path: build/release-staging/*
          if-no-files-found: error

  release-draft:
    if: github.event_name == 'push' && github.event.deleted != true && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_APK_PACKAGING == 'true'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-draft-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.4'
      - uses: actions/download-artifact@v8
        with:
          name: layeranalyzer-${{ github.ref_name }}
          path: build/release-staging
      - name: Create and verify draft attachments
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python tools/create_release_draft.py
          --staging build/release-staging
          --repo "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --commit "$GITHUB_SHA"
