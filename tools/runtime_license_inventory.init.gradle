import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.util.zip.ZipFile
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.security.MessageDigest

// Run with: ./gradlew -I tools/runtime_license_inventory.init.gradle :app:exportRuntimeLicenseInventory
// This resolves the selected configuration without changing application dependencies.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('exportRuntimeLicenseInventory') {
        group = 'verification'
        // Export from the actual Release APK, not an OFF resolution or an older build.
        dependsOn('assembleRelease')
        description = 'Export exact runtime components and artifact hashes for license review.'
        doLast {
            def strictFlag = { key, fallback = null ->
                def setting = app.providers.gradleProperty(key)
                def value = fallback == null ? setting.get() : setting.getOrElse(fallback)
                if (!(value in ['true', 'false'])) throw new GradleException("Invalid boolean: ${key}")
                value == 'true'
            }
            def tlsEnabled = strictFlag('layanalyzerEnableTls')
            def tlsProbe = strictFlag('layanalyzerTlsProbe', 'false')
            if (tlsProbe) throw new GradleException('Release inventory forbids TLS probes')
            def hash = { byte[] data -> MessageDigest.getInstance('SHA-256').digest(data).encodeHex().toString() }
            def apks = app.layout.buildDirectory.dir('outputs/apk/release').get().asFile.listFiles()
                ?.findAll { it.name.endsWith('.apk') } ?: []
            if (apks.size() != 1) throw new GradleException('Expected exactly one freshly built Release APK')
            def apk = apks[0]
            def bridge = null
            new ZipFile(apk).withCloseable { zip ->
                def engines = zip.entries().findAll { it.name.startsWith('lib/') && it.name.endsWith('/liblayanalyzer_tls.so') }
                if (!tlsEnabled && !engines.empty) throw new GradleException('TLS OFF APK contains Go bridge')
                if (tlsEnabled) {
                    def directory = app.rootProject.layout.buildDirectory.dir('tls-production/release').get().asFile
                    def manifestFile = new File(directory, 'build-manifest.json')
                    def manifest = new JsonSlurper().parse(manifestFile)
                    def library = new File(directory, 'liblayanalyzer_tls.so')
                    def lock = new JsonSlurper().parse(app.rootProject.file('native_go/tlsbridge/toolchain-lock.json'))
                    def inputs = manifest.inputs
                    if (manifest.schemaVersion != 1 || manifest.elfAudit != 'PASS' ||
                        manifest.goVersion != lock.goVersion || manifest.ndkVersion != lock.androidNdkVersion ||
                        manifest.sha256 != hash(library.bytes) ||
                        inputs.environment.GOOS != 'android' || inputs.environment.GOTOOLCHAIN != 'local' ||
                        inputs.command.any { it.contains('tlsprobe') } ||
                        inputs.sourceFiles.any { path, sha -> hash(app.rootProject.file(path).bytes) != sha } ||
                        engines.size() != 1 || engines[0].name != "lib/${manifest.abi}/liblayanalyzer_tls.so") {
                        throw new GradleException('Stale or nonproduction TLS bridge provenance')
                    }
                    bridge = [kind: 'production-go', abi: manifest.abi, goVersion: manifest.goVersion,
                              manifestSha256: hash(manifestFile.bytes), librarySha256: manifest.sha256,
                              packagedSha256: hash(zip.getInputStream(engines[0]).bytes),
                              sourceTreeSha256: inputs.sourceTreeSha256, sourceFiles: inputs.sourceFiles]
                }
            }
            def name = app.findProperty('licenseConfiguration') ?: 'releaseRuntimeClasspath'
            def configuration = app.configurations.getByName(name)
            def artifacts = configuration.resolvedConfiguration.resolvedArtifacts
            def components = configuration.incoming.resolutionResult.allComponents
                .findAll { it.id instanceof ModuleComponentIdentifier }
                .sort { it.id.displayName }
                .collect { component ->
                    def id = component.id
                    [coordinate: "${id.group}:${id.module}:${id.version}",
                     artifacts: artifacts.findAll {
                         it.moduleVersion.id.group == id.group &&
                         it.moduleVersion.id.name == id.module &&
                         it.moduleVersion.id.version == id.version
                     }.collect { it.file }.unique().sort { it.name }.collect { file ->
                         [file: file.name,
                          sha256: MessageDigest.getInstance('SHA-256')
                              .digest(file.bytes).encodeHex().toString()]
                     }]
                }
            def output = app.rootProject.layout.buildDirectory
                .file("license-audit/${name}.json").get().asFile
            output.parentFile.mkdirs()
            output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                configuration: name, components: components,
                build: [applicationId: app.android.defaultConfig.applicationId,
                        versionName: app.android.defaultConfig.versionName,
                        versionCode: app.android.defaultConfig.versionCode,
                        ndkVersion: app.android.ndkVersion,
                        abis: app.android.buildTypes.release.ndk.abiFilters.sort(),
                        g729: (app.findProperty('layanalyzerEnableG729') ?: 'true').toBoolean(),
                        ilbc: (app.findProperty('layanalyzerEnableIlbc') ?: 'false').toBoolean(),
                        tlsEnabled: tlsEnabled, tlsProbe: tlsProbe, tlsBridge: bridge,
                        apkSha256: hash(apk.bytes)]
            ])) + '\n', 'UTF-8')
            logger.lifecycle("Exported ${components.size()} components to ${output}")
        }
    }
}
